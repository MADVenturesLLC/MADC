[package]
name = "madc-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
description = "MADC Desktop v1 shell (Tauri v2, M3-A2 scaffold)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
